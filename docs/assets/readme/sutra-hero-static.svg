<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="ambientVioletS" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#0B0D12" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ambientCyanS" cx="30%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#0B0D12" stop-opacity="0" />
    </radialGradient>

    <!-- Thread Stroke Gradients -->
    <linearGradient id="threadGrad1S" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="threadGrad2S" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#818CF8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="threadGrad3S" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.5" />
      <stop offset="40%" stop-color="#4F46E5" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBgS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141926" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0D111A" stop-opacity="0.98" />
    </linearGradient>

    <linearGradient id="sutraGlowS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <filter id="glowSubtleS" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Surface & Ambient Atmosphere -->
  <rect width="100%" height="100%" fill="#0B0D12" rx="14" />
  <rect width="100%" height="100%" fill="url(#ambientCyanS)" rx="14" />
  <rect width="100%" height="100%" fill="url(#ambientVioletS)" rx="14" />

  <!-- Subtle Precision Grid Pattern -->
  <g stroke="#182030" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="2 6">
    <line x1="60" y1="0" x2="60" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="360" y1="0" x2="360" y2="360" />
    <line x1="520" y1="0" x2="520" y2="360" />
    <line x1="680" y1="0" x2="680" y2="360" />
    <line x1="840" y1="0" x2="840" y2="360" />
    <line x1="0" y1="90" x2="940" y2="90" />
    <line x1="0" y1="180" x2="940" y2="180" />
    <line x1="0" y1="270" x2="940" y2="270" />
  </g>

  <!-- ==================== LEFT REGION: SCATTERED THOUGHTS ==================== -->
  <g id="scattered-thoughts-static">
    <text x="50" y="42" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#64748B" letter-spacing="1.5">01 // UNSTRUCTURED THOUGHTS</text>

    <!-- Thought Node 1: Intent -->
    <g transform="translate(60, 75)">
      <rect x="0" y="0" width="168" height="34" rx="6" fill="#131826" stroke="#253248" stroke-width="1" />
      <circle cx="16" cy="17" r="4" fill="#06B6D4" />
      <text x="28" y="21" font-family="'JetBrains Mono', monospace" font-size="11" fill="#E2E8F0">intent: "parse invoice"</text>
    </g>

    <!-- Thought Node 2: Role -->
    <g transform="translate(140, 135)">
      <rect x="0" y="0" width="160" height="34" rx="6" fill="#131826" stroke="#253248" stroke-width="1" />
      <circle cx="16" cy="17" r="4" fill="#818CF8" />
      <text x="28" y="21" font-family="'JetBrains Mono', monospace" font-size="11" fill="#E2E8F0">role: senior_auditor</text>
    </g>

    <!-- Thought Node 3: Constraint -->
    <g transform="translate(50, 205)">
      <rect x="0" y="0" width="176" height="34" rx="6" fill="#131826" stroke="#253248" stroke-width="1" />
      <circle cx="16" cy="17" r="4" fill="#F43F5E" />
      <text x="28" y="21" font-family="'JetBrains Mono', monospace" font-size="11" fill="#E2E8F0">rule: zero_hallucination</text>
    </g>

    <!-- Thought Node 4: Format -->
    <g transform="translate(130, 275)">
      <rect x="0" y="0" width="155" height="34" rx="6" fill="#131826" stroke="#253248" stroke-width="1" />
      <circle cx="16" cy="17" r="4" fill="#10B981" />
      <text x="28" y="21" font-family="'JetBrains Mono', monospace" font-size="11" fill="#E2E8F0">output: JSON_schema</text>
    </g>
  </g>

  <!-- ==================== CENTER REGION: THE INTELLIGENT THREADS ==================== -->
  <g id="intelligent-threads-static">
    <!-- Thread 1 -->
    <path d="M 228 92 C 340 92, 380 150, 470 170" fill="none" stroke="url(#threadGrad1S)" stroke-width="2.5" stroke-linecap="round" filter="url(#glowSubtleS)" />

    <!-- Thread 2 -->
    <path d="M 300 152 C 360 152, 400 175, 470 180" fill="none" stroke="url(#threadGrad2S)" stroke-width="2.2" stroke-linecap="round" filter="url(#glowSubtleS)" />

    <!-- Thread 3 -->
    <path d="M 226 222 C 330 222, 390 195, 470 190" fill="none" stroke="url(#threadGrad3S)" stroke-width="2.5" stroke-linecap="round" filter="url(#glowSubtleS)" />

    <!-- Thread 4 -->
    <path d="M 285 292 C 370 292, 400 215, 470 200" fill="none" stroke="url(#threadGrad1S)" stroke-width="2" stroke-linecap="round" filter="url(#glowSubtleS)" />

    <!-- Center Convergence Prism -->
    <g transform="translate(470, 185)">
      <circle cx="0" cy="0" r="28" fill="#111624" stroke="#334155" stroke-width="1.5" />
      <circle cx="0" cy="0" r="20" fill="none" stroke="#6366F1" stroke-width="1" stroke-dasharray="3 3" />
      <polygon points="0,-12 12,0 0,12 -12,0" fill="none" stroke="url(#sutraGlowS)" stroke-width="2" />
      <circle cx="0" cy="0" r="4" fill="#FFFFFF" filter="url(#glowSubtleS)" />
    </g>

    <!-- Outgoing Laser Threads -->
    <path d="M 498 185 C 530 185, 540 140, 580 140" fill="none" stroke="url(#threadGrad1S)" stroke-width="3" stroke-linecap="round" filter="url(#glowSubtleS)" />
    <path d="M 498 185 C 530 185, 540 190, 580 190" fill="none" stroke="url(#threadGrad2S)" stroke-width="2.5" stroke-linecap="round" filter="url(#glowSubtleS)" />
    <path d="M 498 185 C 530 185, 540 240, 580 240" fill="none" stroke="url(#threadGrad3S)" stroke-width="3" stroke-linecap="round" filter="url(#glowSubtleS)" />
  </g>

  <!-- ==================== RIGHT REGION: STRUCTURED INSTRUCTION ==================== -->
  <g transform="translate(580, 48)">
    <text x="0" y="-6" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#A855F7" letter-spacing="1.5">02 // STRUCTURED INSTRUCTION MATRIX</text>

    <!-- Main Instruction Container -->
    <rect x="0" y="8" width="315" height="268" rx="10" fill="url(#cardBgS)" stroke="#26334D" stroke-width="1.5" />

    <!-- Terminal Titlebar Chrome -->
    <rect x="0" y="8" width="315" height="30" rx="10" fill="#161D2C" />
    <rect x="0" y="28" width="315" height="10" fill="#161D2C" />
    <circle cx="16" cy="23" r="4" fill="#EF4444" opacity="0.8" />
    <circle cx="28" cy="23" r="4" fill="#F59E0B" opacity="0.8" />
    <circle cx="40" cy="23" r="4" fill="#10B981" opacity="0.8" />
    <text x="60" y="27" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#94A3B8">sutra://compiled_prompt.xml</text>

    <!-- Prompt Content Lines -->
    <g transform="translate(16, 54)" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500">
      <text x="0" y="14" fill="#38BDF8">&lt;role&gt;</text>
      <text x="50" y="14" fill="#F1F5F9">Senior Financial Auditor</text>
      <text x="218" y="14" fill="#38BDF8">&lt;/role&gt;</text>

      <text x="0" y="38" fill="#818CF8">&lt;objective&gt;</text>
      <text x="0" y="56" fill="#CBD5E1">Extract line items, tax IDs &amp;</text>
      <text x="0" y="74" fill="#CBD5E1">totals with 100% precision.</text>
      <text x="0" y="92" fill="#818CF8">&lt;/objective&gt;</text>

      <text x="0" y="116" fill="#F43F5E">&lt;invariants&gt;</text>
      <text x="12" y="134" fill="#94A3B8">• Output strict RFC 8259 JSON</text>
      <text x="12" y="152" fill="#94A3B8">• Do not extrapolate missing sums</text>
      <text x="0" y="170" fill="#F43F5E">&lt;/invariants&gt;</text>

      <!-- Telemetry Strip -->
      <g transform="translate(0, 186)">
        <rect x="0" y="0" width="283" height="24" rx="4" fill="#0B0E17" stroke="#1E293B" stroke-width="1" />
        <circle cx="10" cy="12" r="3" fill="#10B981" />
        <text x="18" y="15" font-size="9.5" fill="#64748B">RUBRIC:</text>
        <text x="62" y="15" font-size="9.5" fill="#38BDF8" font-weight="700">98/100</text>
        <text x="120" y="15" font-size="9.5" fill="#64748B">TOKENS:</text>
        <text x="166" y="15" font-size="9.5" fill="#A855F7" font-weight="700">246</text>
        <text x="206" y="15" font-size="9.5" fill="#64748B">MODE:</text>
        <text x="238" y="15" font-size="9.5" fill="#10B981" font-weight="700">PREC</text>
      </g>
    </g>
  </g>
</svg>
