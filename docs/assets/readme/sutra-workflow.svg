<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 160" width="100%" height="100%">
  <defs>
    <linearGradient id="flowThread" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="30%" stop-color="#6366F1" />
      <stop offset="70%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="stepBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141926" />
      <stop offset="100%" stop-color="#0D111A" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0B0D12" rx="12" />

  <!-- Underlying Continuous Flow Thread -->
  <line x1="80" y1="80" x2="860" y2="80" stroke="url(#flowThread)" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.6" />

  <!-- STEP 1: YOUR IDEA -->
  <g transform="translate(30, 28)">
    <rect x="0" y="0" width="130" height="104" rx="8" fill="url(#stepBg)" stroke="#1F283B" stroke-width="1.2" />
    <circle cx="20" cy="22" r="10" fill="#06B6D4" fill-opacity="0.2" />
    <text x="20" y="26" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">01</text>
    <text x="14" y="52" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#F1F5F9">YOUR IDEA</text>
    <text x="14" y="70" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94A3B8">Raw, unstructured</text>
    <text x="14" y="84" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94A3B8">human thought</text>
  </g>

  <!-- STEP 2: INTENT -->
  <g transform="translate(180, 28)">
    <rect x="0" y="0" width="130" height="104" rx="8" fill="url(#stepBg)" stroke="#1F283B" stroke-width="1.2" />
    <circle cx="20" cy="22" r="10" fill="#6366F1" fill-opacity="0.2" />
    <text x="20" y="26" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#818CF8" text-anchor="middle">02</text>
    <text x="14" y="52" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#F1F5F9">INTENT</text>
    <text x="14" y="70" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94A3B8">Goal detection &amp;</text>
    <text x="14" y="84" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94A3B8">domain extraction</text>
  </g>

  <!-- STEP 3: CONTEXT -->
  <g transform="translate(330, 28)">
    <rect x="0" y="0" width="130" height="104" rx="8" fill="url(#stepBg)" stroke="#1F283B" stroke-width="1.2" />
    <circle cx="20" cy="22" r="10" fill="#8B5CF6" fill-opacity="0.2" />
    <text x="20" y="26" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#A855F7" text-anchor="middle">03</text>
    <text x="14" y="52" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#F1F5F9">CONTEXT</text>
    <text x="14" y="70" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94A3B8">Inject selected rules</text>
    <text x="14" y="84" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94A3B8">&amp; boundary profiles</text>
  </g>

  <!-- STEP 4: CONSTRUCTION -->
  <g transform="translate(480, 28)">
    <rect x="0" y="0" width="130" height="104" rx="8" fill="url(#stepBg)" stroke="#1F283B" stroke-width="1.2" />
    <circle cx="20" cy="22" r="10" fill="#A855F7" fill-opacity="0.2" />
    <text x="20" y="26" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#C084FC" text-anchor="middle">04</text>
    <text x="14" y="52" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#F1F5F9">CONSTRUCT</text>
    <text x="14" y="70" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94A3B8">Synthesize 9 facets</text>
    <text x="14" y="84" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94A3B8">&amp; delimiters</text>
  </g>

  <!-- STEP 5: OPTIMIZATION -->
  <g transform="translate(630, 28)">
    <rect x="0" y="0" width="130" height="104" rx="8" fill="url(#stepBg)" stroke="#1F283B" stroke-width="1.2" />
    <circle cx="20" cy="22" r="10" fill="#EC4899" fill-opacity="0.2" />
    <text x="20" y="26" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#F472B6" text-anchor="middle">05</text>
    <text x="14" y="52" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#F1F5F9">OPTIMIZE</text>
    <text x="14" y="70" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94A3B8">10-mode refactor &amp;</text>
    <text x="14" y="84" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94A3B8">explainable diffs</text>
  </g>

  <!-- STEP 6: READY INSTRUCTION -->
  <g transform="translate(780, 28)">
    <rect x="0" y="0" width="130" height="104" rx="8" fill="url(#stepBg)" stroke="#059669" stroke-width="1.5" />
    <circle cx="20" cy="22" r="10" fill="#10B981" fill-opacity="0.2" />
    <text x="20" y="26" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle">06</text>
    <text x="14" y="52" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#10B981">EXECUTE</text>
    <text x="14" y="70" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94A3B8">Ready instruction</text>
    <text x="14" y="84" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94A3B8">benchmarked in lab</text>
  </g>
</svg>
